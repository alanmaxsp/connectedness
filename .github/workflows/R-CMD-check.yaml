name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libgit2-dev \
            libuv1-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::remotes
            any::roxygen2
            any::rmarkdown
            any::knitr
            any::pkgdown
            any::rcmdcheck
            any::testthat
          needs: check

      - name: Compile Rcpp attributes
        run: |
          Rscript -e 'Rcpp::compileAttributes()'

      - name: Generate roxygen documentation
        run: |
          Rscript -e 'roxygen2::roxygenise()'

      - name: Build vignettes
        run: |
          Rscript -e 'devtools::build_vignettes()'

      - name: Run R CMD check
        run: |
          Rscript -e 'rcmdcheck::rcmdcheck(args = c("--no-manual"), error_on = "never")'
